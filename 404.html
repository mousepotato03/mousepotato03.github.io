          document.documentElement.dataset.theme = saved;

    </script><link rel="stylesheet" href="/_astro/Base.Bn7zN9Kk.css"></head><body><a class="skip" href="#main">본문으로 건너뛰기</a><header class="site-header content" id="top"><a class="handle" href="/">@mousepotato03<span class="sr"> 홈</span></a><button class="theme-toggle" type="button" hidden><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a8.5 8.5 0 1 0 11 11Z"></path></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></button></header><main id="main" tabindex="-1"><div class="page content"><header class="page-head"><h1>페이지를 찾을 수 없습니다</h1><p>주소가 바뀌었거나 삭제된 페이지입니다.</p></header><a class="back-link" href="/">홈으로 돌아가기</a></div></main><footer class="site-footer content"><span>© 2026 박승진</span></footer><script>
      (() => {
        const button = document.querySelector(".theme-toggle");
        if (!button) return;
        const root = document.documentElement;
        const media = matchMedia("(prefers-color-scheme: dark)");
        const current = () =>
          root.dataset.theme || (media.matches ? "dark" : "light");
        const label = () =>
          button.setAttribute(
            "aria-label",
            current() === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환",
          );
        button.hidden = false;
        label();
        button.addEventListener("click", () => {
          const next = current() === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
          label();
        });
        media.addEventListener("change", label);
      })();
    </script></body></html>
